{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Openspaces — harnais de test</title>
  <script src="{% static 'ui/vendor/htmx.min.js' %}"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #fafafa; }
    header { padding: 0.75rem 1rem; border-bottom: 1px solid #ddd; background: #fff; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    header nav { display: flex; gap: 1rem; font-size: 0.85rem; }
    header nav a { color: #555; text-decoration: none; }
    header nav a:hover { text-decoration: underline; }
    .columns { display: flex; height: calc(100vh - 49px); }
    .column { flex: 1; min-width: 0; padding: 1rem; overflow-y: auto; }
    .column + .column { border-left: 1px solid #ddd; }
    #dropzone {
      border: 2px dashed #bbb; border-radius: 8px; padding: 2rem 1rem;
      text-align: center; color: #666; cursor: pointer; margin-bottom: 1rem;
    }
    #dropzone.dragging { border-color: #3b6; background: #f0fff4; }
    .object-row, .log-row { padding: 0.4rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .object-row summary { cursor: pointer; color: #555; font-size: 0.85rem; }
    .object-row form { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
    .object-row form input[type="text"] { flex: 1; }
    .muted { color: #888; font-size: 0.8rem; }
    textarea#prompt { width: 100%; box-sizing: border-box; min-height: 5rem; font-family: inherit; }
    section h2, .column h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: #555; margin-top: 1rem; }
    .errors { color: #b00; font-size: 0.85rem; }
    .divergence { color: #a60; font-size: 0.85rem; }
    .view-column h2 { font-size: 0.9rem; margin-top: 0; }
    .view-column table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .view-column table input, .view-column table select { width: 100%; box-sizing: border-box; }
    .view-column td, .view-column th { padding: 0.25rem; text-align: left; }
    .mermaid-source {
      background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; padding: 0.5rem;
      font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
    }
    a.back { font-size: 0.85rem; }
    table.browse { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.browse td, table.browse th { padding: 0.3rem; border-bottom: 1px solid #eee; text-align: left; }

    .tree-column { flex: 0 0 26%; max-width: 320px; border-right: 1px solid #ddd; }
    .content-column { flex: 1; min-width: 0; padding: 0; }
    #browse-content { padding: 1rem; height: 100%; overflow-y: auto; box-sizing: border-box; }
    .type-filter select { width: 100%; margin-bottom: 0.75rem; }
    .dossier-tree { list-style: none; margin: 0; padding-left: 0.9rem; }
    .dossier-tree:first-of-type { padding-left: 0; }
    .dossier-node { margin: 0.15rem 0; }
    .dossier-link { display: inline-block; padding: 0.15rem 0.3rem; border-radius: 4px; text-decoration: none; color: #333; font-size: 0.85rem; }
    .dossier-link:hover { background: #f0f0f0; }
    .dossier-link.active { background: #dbeafe; font-weight: 600; }
    .dossier-node details summary { cursor: pointer; font-size: 0.75rem; color: #888; margin-left: 0.3rem; }
    .dyn-badge {
      display: inline-block; margin-left: 0.3rem; padding: 0.05rem 0.35rem;
      border-radius: 999px; background: #fef3c7; color: #92400e;
      font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em;
      vertical-align: middle;
    }

    .confirm { color: #16653f; font-size: 0.85rem; background: #ecfdf5; border: 1px solid #a7e8cb; border-radius: 4px; padding: 0.4rem 0.6rem; }
    .preview { outline: none; }
    .preview-nav { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 0.75rem; }
    .preview-nav a, .preview-nav span { padding: 0.2rem 0.4rem; }
    table.attrs { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 0.5rem 0; }
    table.attrs th { text-align: left; color: #888; font-weight: 500; width: 30%; padding: 0.2rem 0.5rem 0.2rem 0; vertical-align: top; }
    table.attrs td { padding: 0.2rem 0; word-break: break-word; }
    .classify-form { display: flex; gap: 0.5rem; align-items: center; margin: 0.75rem 0; }
    .view-tabs { display: flex; gap: 0.5rem; margin: 0.75rem 0 0.25rem; border-bottom: 1px solid #eee; }
    .view-tabs a { font-size: 0.8rem; padding: 0.3rem 0.5rem; text-decoration: none; color: #666; }
    .view-tabs a.active { color: #1a1a1a; font-weight: 600; border-bottom: 2px solid #2563eb; }
    hr.sep { border: none; border-top: 1px solid #eee; margin: 1rem 0; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <h1>Openspaces — harnais de test ({{ space.name }})</h1>
    <nav>
      <a href="{% url 'workspace' %}">espace de travail</a>
      <a href="{% url 'object-browse' %}">objets &amp; liens</a>
      <a href="{% url 'bus-page' %}">bus</a>
    </nav>
  </header>
  <div class="columns">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
