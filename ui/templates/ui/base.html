{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Openspaces — harnais de test</title>
  <script src="{% static 'ui/vendor/htmx.min.js' %}"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #fafafa; }
    header { padding: 0.75rem 1rem; border-bottom: 1px solid #ddd; background: #fff; }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    .columns { display: flex; height: calc(100vh - 49px); }
    .column { flex: 1; min-width: 0; padding: 1rem; overflow-y: auto; }
    .column + .column { border-left: 1px solid #ddd; }
    #dropzone {
      border: 2px dashed #bbb; border-radius: 8px; padding: 2rem 1rem;
      text-align: center; color: #666; cursor: pointer; margin-bottom: 1rem;
    }
    #dropzone.dragging { border-color: #3b6; background: #f0fff4; }
    .object-row, .log-row { padding: 0.4rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .object-row summary { cursor: pointer; color: #555; font-size: 0.85rem; }
    .object-row form { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
    .object-row form input[type="text"] { flex: 1; }
    .muted { color: #888; font-size: 0.8rem; }
    textarea#prompt { width: 100%; box-sizing: border-box; min-height: 5rem; font-family: inherit; }
    section h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: #555; }
    .errors { color: #b00; font-size: 0.85rem; }
    .view-column h2 { font-size: 0.9rem; margin-top: 0; }
    .view-column table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .view-column table input, .view-column table select { width: 100%; box-sizing: border-box; }
    .view-column td, .view-column th { padding: 0.25rem; text-align: left; }
    .mermaid-source {
      background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; padding: 0.5rem;
      font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
    }
    a.back { font-size: 0.85rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header><h1>Openspaces — harnais de test ({{ space.name }})</h1></header>
  <div class="columns">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
