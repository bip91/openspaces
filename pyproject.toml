[project]
name = "openspaces"
version = "0.1.0"
description = "Maquette d'un moteur d'objets typés, versionnés et liés"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<7",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "pgvector>=0.3",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
